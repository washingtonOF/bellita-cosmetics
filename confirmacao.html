<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Status do pedido | Bellita Cosmetics</title><style>body{font:17px Arial;background:#faf6f0;color:#244536}main{max-width:640px;margin:10vh auto;padding:36px;border-radius:20px;background:white}img{width:155px}.btn{display:inline-block;background:#315d4a;color:white;padding:13px 20px;border-radius:30px;text-decoration:none}</style><main><img src="assets/logo-bellita.png" alt="Bellita Cosmetics"><h1>Acompanhe seu pagamento</h1><p id="status" role="status">Consultando o status do pagamento com segurança…</p><p id="detail"></p><a class="btn" href="/">Voltar à loja</a></main><script>const q=new URLSearchParams(location.search),id=q.get('payment_id')||q.get('collection_id');const status=document.getElementById('status'),detail=document.getElementById('detail');if(!id||!/^[0-9]+$/.test(id)){status.textContent='Ainda não há um pagamento identificado para consulta. Isso não confirma nem cancela a compra.'}else{fetch('/api/payment-status?id='+encodeURIComponent(id)).then(r=>r.json().then(d=>({ok:r.ok,d}))).then(({ok,d})=>{if(!ok)throw Error(d.error||'Falha na consulta');const messages={approved:'Pagamento aprovado!',pending:'Pagamento pendente de confirmação.',in_process:'Pagamento em análise.',rejected:'Pagamento não aprovado.',cancelled:'Pagamento cancelado.',refunded:'Pagamento reembolsado.'};status.textContent=messages[d.status]||'Status atual: '+d.status;detail.textContent='ID do pagamento: '+id+(d.status==='approved'?' — Guarde o comprovante.':' — Consulte novamente mais tarde.')}).catch(e=>{status.textContent='Não foi possível verificar o pagamento.';detail.textContent=e.message})}</script></html>
